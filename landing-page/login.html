<!DOCTYPE html>
<html lang="en">

<head>

    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            padding: 2rem;
        }

        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 3rem;
            max-width: 450px;
            width: 100%;
            text-align: center;
        }

        .login-logo {
            font-size: 2rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            margin-bottom: 0.5rem;
        }

        .login-subtitle {
            color: var(--text-dim);
            font-size: 0.85rem;
            margin-bottom: 3rem;
        }

        .login-title {
            font-size: 1.8rem;
            margin-bottom: 1rem;
        }

        .login-description {
            color: var(--text-secondary);
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }

        .github-btn {
            width: 100%;
            padding: 1rem 2rem;
            background: #24292e;
            color: #fff;
            border: 1px solid #444;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .github-btn:hover {
            background: #2f363d;
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .github-icon {
            width: 24px;
            height: 24px;
        }

        .benefits {
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
            text-align: left;
        }

        .benefit-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .benefit-check {
            width: 20px;
            height: 20px;
            background: var(--accent);
            color: #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-weight: 700;
            font-size: 0.75rem;
        }

        .back-link {
            margin-top: 2rem;
            display: block;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.85rem;
        }

        .back-link:hover {
            color: var(--accent);
        }
    </style>
</head>

<body>
    <div class="login-container">

</body>

</html>
